name: Build and Push Container (private registry)

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: simple-transit-container-build
  cancel-in-progress: true

jobs:
  docker:
    runs-on: [self-hosted, nibbler, docker]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on main branch
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "❌ Tag ${GITHUB_REF_NAME} is not on main branch"
            exit 1
          fi

      - name: Set version
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="sha-${GITHUB_SHA::12}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: "Preflight: registry reachable"
        run: |
          set -euo pipefail
          # /v2/ returns 401 when reachable but unauthenticated; that's OK.
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /dev/null -m 5 -w "%{http_code}" "https://${{ secrets.REGISTRY_HOST }}/v2/" || true)
            if [[ "$code" == "200" || "$code" == "401" ]]; then
              echo "registry reachable (http $code)"
              exit 0
            fi
            echo "registry preflight failed (http $code) (attempt $i/5), retrying..."
            sleep 2
          done
          echo "registry preflight failed"
          exit 1

      - name: Login to private registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build image
        run: |
          set -euo pipefail
          IMAGE=${{ secrets.REGISTRY_HOST }}/niepi/simple-transit
          docker build --network=host \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            --label org.opencontainers.image.source=https://github.com/niepi/simple-transit \
            -t $IMAGE:${{ env.VERSION }} \
            .
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Install Trivy
        # Not using aquasecurity/trivy-action: its bundled installer tries
        # to git-clone aquasecurity/trivy as a fallback and that path is
        # unreliable on Forgejo/act-based runners (fails either on GitHub
        # API auth or a missing install script, inconsistently). The
        # official install script (single-file fetch, no git/API calls)
        # sidesteps that entirely. Pinned to 0.69.3: the last release
        # confirmed unaffected by the March 2026 Trivy supply-chain
        # compromise (GHSA-69fq-xp46-6x23).
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/v0.69.3/contrib/install.sh \
            | sh -s -- -b /usr/local/bin v0.69.3

      - name: Trivy gate (blocks push and ship)
        env:
          TRIVY_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-java-db:1
          TRIVY_SCANNERS: vuln
        run: |
          set -euo pipefail
          docker save "${{ env.IMAGE }}:${{ env.VERSION }}" -o /tmp/simple-transit-scan.tar
          trivy image --input /tmp/simple-transit-scan.tar --format table --exit-code 1 --ignore-unfixed \
            --vuln-type os,library --severity CRITICAL,HIGH
          rm -f /tmp/simple-transit-scan.tar

      - name: Push scanned image to Forgejo
        run: |
          set -euo pipefail
          docker push "${{ env.IMAGE }}:${{ env.VERSION }}"

      - name: Install crane (pinned, sha256 verified)
        run: |
          set -euo pipefail
          curl -sfL -o /tmp/crane.tgz https://github.com/google/go-containerregistry/releases/download/v0.22.1/go-containerregistry_Linux_x86_64.tar.gz
          echo "0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0  /tmp/crane.tgz" | sha256sum -c -
          tar -xzf /tmp/crane.tgz -C /usr/local/bin crane
          crane version

      - name: Save tarball with crane and push to web3
        env:
          WEB3_HOST: ${{ secrets.WEB3_HOST }}
          WEB3_SSH_KEY: ${{ secrets.WEB3_SSH_KEY }}
          WEB3_KNOWN_HOSTS: ${{ secrets.WEB3_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          TAR="/tmp/simple-transit-${{ env.VERSION }}.tar"
          crane pull --platform linux/amd64 "${{ env.IMAGE }}:${{ env.VERSION }}" "$TAR"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$WEB3_SSH_KEY" > ~/.ssh/web3 && chmod 600 ~/.ssh/web3
          printf '%s\n' "$WEB3_KNOWN_HOSTS" > ~/.ssh/known_hosts
          scp -i ~/.ssh/web3 -o StrictHostKeyChecking=yes "$TAR" root@$WEB3_HOST:/srv/images/incoming/
          rm -f "$TAR"
